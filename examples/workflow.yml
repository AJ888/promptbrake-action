name: PromptBrake Quick Check
on:
  workflow_dispatch:
  push:
    branches: [main]
# Add same-repository pull_request runs after reviewing how your test credentials
# are used. Forked PRs do not receive secrets; do not use pull_request_target
# to execute untrusted PR code with credentials.
permissions:
  contents: read
jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: AJ888/promptbrake-action@v0.1.0
        with:
          target-url: ${{ secrets.PB_TARGET_URL }}
          auth-token: ${{ secrets.PB_TARGET_AUTH_TOKEN }}
          config: promptbrake.json
          groups: both
