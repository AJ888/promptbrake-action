name: Test Action
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Start deterministic fixture
        run: |
          python examples/demo_server.py &
          for attempt in {1..20}; do
            if curl --silent --output /dev/null http://127.0.0.1:8765; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - uses: ./
        with:
          target-url: http://127.0.0.1:8765/chat
          config: examples/promptbrake.json
      - name: Start failing deterministic fixture
        run: |
          python examples/demo_server.py --port 8766 --vulnerable &
          for attempt in {1..20}; do
            if curl --silent --output /dev/null http://127.0.0.1:8766; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - uses: ./
        id: failing
        continue-on-error: true
        with:
          target-url: http://127.0.0.1:8766/chat
          config: examples/promptbrake.json
          artifact-name: expected-failure-report
      - name: Verify failure gate and outputs
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          STATUS: ${{ steps.failing.outputs.status }}
          FAILED: ${{ steps.failing.outputs.failed }}
        run: test "$OUTCOME" = failure && test "$STATUS" = fail && test "$FAILED" = 10
      - name: Start safe tool dispatcher fixture
        run: |
          PYTHONPATH=. python examples/agent-tool-checks/example_agent.py --port 8767 &
          for attempt in {1..20}; do
            if curl --silent --output /dev/null http://127.0.0.1:8767; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - uses: ./
        id: tools
        with:
          target-url: http://127.0.0.1:8767/chat
          config: examples/tool-config.json
          groups: tools
          tool-tests: examples/tool-tests.json
          artifact-name: tool-check-report
      - name: Verify tool capture outputs
        env:
          STATUS: ${{ steps.tools.outputs.status }}
          PASSED: ${{ steps.tools.outputs.passed }}
        run: test "$STATUS" = pass && test "$PASSED" = 2
      - name: Start unsafe tool dispatcher fixture
        run: |
          PYTHONPATH=. python examples/agent-tool-checks/example_agent.py --port 8768 --mode vulnerable &
          for attempt in {1..20}; do
            if curl --silent --output /dev/null http://127.0.0.1:8768; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - uses: ./
        id: unsafe_tools
        continue-on-error: true
        with:
          target-url: http://127.0.0.1:8768/chat
          config: examples/tool-config.json
          groups: tools
          tool-tests: examples/tool-tests.json
          artifact-name: expected-tool-failure-report
      - name: Verify tool violation gate
        env:
          OUTCOME: ${{ steps.unsafe_tools.outcome }}
          STATUS: ${{ steps.unsafe_tools.outputs.status }}
          FAILED: ${{ steps.unsafe_tools.outputs.failed }}
        run: test "$OUTCOME" = failure && test "$STATUS" = fail && test "$FAILED" = 1
