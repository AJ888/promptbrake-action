[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbrake-tool-checks"
version = "1.0.0"
description = "Application dispatcher capture and deterministic agent tool-call assertions"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["promptbrake_tools*"]
